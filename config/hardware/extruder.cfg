# Galileo2 extruder and Dragon hotend

[extruder]
# Galileo2 motor and reduction
step_pin: sb2040:gpio14
dir_pin: sb2040:gpio13
enable_pin: !sb2040:gpio16
rotation_distance: 47.088
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200

# Filament path, mm
nozzle_diameter: 0.6
filament_diameter: 1.75
max_extrude_cross_section: 5           # Maximum extrusion cross-section, mm^2

# Hotend heater
heater_pin: sb2040:gpio23
control: watermark                    # Temporary, until PID_CALIBRATE + SAVE_CONFIG
# Run PID_CALIBRATE and SAVE_CONFIG before printing.

# PT100, four-wire MAX31865 interface
sensor_type: MAX31865
sensor_pin: sb2040:gpio17
spi_bus: spi0_gpio4_gpio3_gpio2
rtd_reference_r: 430                  # Ohms
rtd_nominal_r: 100                    # Ohms
rtd_num_of_wires: 4

# Temperature limits, deg C
min_temp: 0
max_temp: 300
min_extrude_temp: 170

# Extruder driver
[tmc2240 extruder]
uart_pin: sb2040:gpio15
run_current: 0.60                     # A RMS
interpolate: true                     # Required by TMC autotune
rref: 12300                           # Ohms
