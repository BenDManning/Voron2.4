# Z motion - Octopus v1.1, four TMC2209 drivers

# Z0 - front left, MOTOR_2
[stepper_z]
# Motor wiring and belt reduction
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

# Travel limits, mm
position_max: 310
position_min: -5                      # Small allowance for Z calibration

# Probe-based Z homing
endstop_pin: probe:z_virtual_endstop
homing_speed: 8                       # mm/s
second_homing_speed: 3                # mm/s
homing_retract_dist: 3                # mm

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8                      # A RMS
sense_resistor: 0.110                 # Ohms
stealthchop_threshold: 0              # 0 = SpreadCycle

# Z1 - rear left, MOTOR_3
[stepper_z1]
# Motor wiring and belt reduction
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8                      # A RMS
sense_resistor: 0.110                 # Ohms
stealthchop_threshold: 0              # 0 = SpreadCycle

# Z2 - rear right, MOTOR_4
[stepper_z2]
# Motor wiring and belt reduction
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8                      # A RMS
sense_resistor: 0.110                 # Ohms
stealthchop_threshold: 0              # 0 = SpreadCycle

# Z3 - front right, MOTOR_5
[stepper_z3]
# Motor wiring and belt reduction
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8                      # A RMS
sense_resistor: 0.110                 # Ohms
stealthchop_threshold: 0              # 0 = SpreadCycle
