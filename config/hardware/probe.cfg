# Eddy probe - SB2040 onboard LDC1612

[probe_eddy_current fly_eddy_probe]
# Sensor and I2C connection
sensor_type: ldc1612
frequency: 40000000                   # Hz
i2c_mcu: sb2040
i2c_bus: i2c1b
i2c_address: 43
i2c_speed: 4000000                    # Hz

# Probe offsets from the nozzle, mm
x_offset: 0
y_offset: 21.42
z_offset: 2.5
# Height calibration and drive current must be measured on this probe and saved.
# SAVE_CONFIG stores the results in printer.cfg; retain that block in backups.

# Homing and leveling

# Z homing at bed center
[safe_z_home]
home_xy_position: 175,175             # Nozzle X,Y in mm
speed: 100                            # XY travel, mm/s
z_hop: 10                             # mm
z_hop_speed: 25                       # mm/s

# Quad gantry leveling - 350 mm bed
[quad_gantry_level]
# Gantry corners at Z0 and Z2, mm
gantry_corners:
    -60,-10
    410,420

# Probe order: front left, rear left, rear right, front right
points:
    50,50
    50,300
    300,300
    300,50

# Travel and convergence
speed: 100                            # mm/s
horizontal_move_z: 10                 # Initial travel height, mm
retries: 5
retry_tolerance: 0.0075               # Maximum corner difference, mm
max_adjust: 10                        # Maximum Z correction, mm

# Adaptive travel height after the first pass
min_horizontal_move_z: 3.0            # Keep clearance above the 2.5 mm trigger height
adaptive_horizontal_move_z: True
use_probe_xy_offsets: True            # Coordinates refer to the probe position

# Bed mesh
[bed_mesh]
# Probing area and travel
mesh_min: 25,25
mesh_max: 325,325
speed: 200                            # mm/s
horizontal_move_z: 5.0                # Must exceed the Eddy trigger height

# Grid and interpolation
probe_count: 15,15                    # X,Y grid points
algorithm: bicubic
bicubic_tension: 0.2

# Reference point and adaptive margin
zero_reference_position: 25,25
adaptive_margin: 5                    # mm around the print area
