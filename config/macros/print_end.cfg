# End and cancel: retract only while hot; park only with known XYZ.

[gcode_macro PRINT_END]
description: Stop heating and finish safely; a paused job is cancelled
gcode:
    TURN_OFF_HEATERS
    M107
    _PRINT_END_DISPATCH

[gcode_macro _PRINT_END_DISPATCH]
gcode:
    {% if printer.pause_resume.is_paused %}
        CANCEL_PRINT
    {% else %}
        _FINISH KIND=END
    {% endif %}

[gcode_macro _FINISH]
gcode:
    _CLEAR_LAYER_PAUSES
    M400
    _FINISH_RETRACT KIND={params.KIND}
    _FINISH_PARK
    M400
    _FINISH_CLEANUP

[gcode_macro _FINISH_RETRACT]
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set previous = printer['gcode_macro _PAUSE_STATE'].retracted %}
    {% set total = v.cancel_retract if params.KIND == 'CANCEL' else v.end_retract %}
    {% set speed = v.cancel_retract_speed if params.KIND == 'CANCEL' else v.end_retract_speed %}
    {% set additional = [total - previous, 0]|max %}
    {% if printer.extruder.can_extrude and additional > 0 %}
        _RETRACT LENGTH={additional} SPEED={speed}
        SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=retracted VALUE={previous + additional}
    {% endif %}

[gcode_macro _FINISH_PARK]
gcode:
    {% if printer.toolhead.homed_axes == 'xyz' %}
        _PARK
    {% else %}
        {action_respond_info("Finish parking skipped: XYZ position is unknown")}
    {% endif %}

[gcode_macro _FINISH_CLEANUP]
gcode:
    # _FINISH drains the move queue before changing mesh compensation.
    BED_MESH_CLEAR
    _RESET_PAUSE_STATE
    _RESET_PRINT_STATE
