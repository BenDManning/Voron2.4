# Homing and gantry leveling
# Safe Z homing, QGL and mesh settings are in hardware/probe.cfg.

[gcode_macro _CHECK_EDDY]
gcode:
    {% set probe = printer.configfile.config["probe_eddy_current fly_eddy_probe"] %}
    {% if not probe.calibrate|default("")|trim %}
        {action_raise_error("Eddy calibration is missing. Calibrate fly_eddy_probe and SAVE_CONFIG before homing or printing.")}
    {% endif %}

[gcode_macro HOME_IF_NEEDED]
description: Home missing axes; FORCE=1 repeats the safe homing procedure
gcode:
    _HOME {rawparams}

[gcode_macro _HOME]
gcode:
    {% set force = params.FORCE|default('0') %}
    {% if force not in ['0', '1'] %}
        {action_raise_error("FORCE must be 0 or 1")}
    {% endif %}
    {% if force == '1' or printer.toolhead.homed_axes != 'xyz' %}
        _CHECK_EDDY
        {% if force == '1' %}
            G28
        {% else %}
            G28{% for axis in 'xyz' %}{% if axis not in printer.toolhead.homed_axes %} {axis|upper}{% endif %}{% endfor %}
        {% endif %}
    {% endif %}
    _HOME_CHECK

[gcode_macro _HOME_CHECK]
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Homing did not establish XYZ position")}
    {% endif %}

[gcode_macro LEVEL_GANTRY]
description: Home if needed, then level unless already applied; FORCE=1 repeats QGL
gcode:
    _LEVEL {rawparams}

[gcode_macro _LEVEL]
gcode:
    {% set force = params.FORCE|default('0') %}
    {% if force not in ['0', '1'] %}
        {action_raise_error("FORCE must be 0 or 1")}
    {% endif %}
    _HOME
    _LEVEL_CHECK FORCE={force}

[gcode_macro _LEVEL_CHECK]
gcode:
    {% if params.FORCE|int == 1 or not printer.quad_gantry_level.applied %}
        _CHECK_EDDY
        BED_MESH_CLEAR
        QUAD_GANTRY_LEVEL
        _LEVEL_Z_REFERENCE
    {% endif %}

[gcode_macro _LEVEL_Z_REFERENCE]
gcode:
    # QGL changes the gantry reference even while Z still reports homed.
    G28 Z
    _LEVEL_READY

[gcode_macro _LEVEL_READY]
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' or not printer.quad_gantry_level.applied %}
        {action_raise_error("Gantry leveling or its Z-reference follow-up did not complete")}
    {% endif %}
