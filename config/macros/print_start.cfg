# Print preparation
# Object definitions before PRINT_START enable adaptive meshing and purge placement.
# PRINT_START BED_TEMP=60 EXTRUDER_TEMP=210 [FORCE_HOME=1] [FORCE_LEVEL=1]

[gcode_macro PRINT_START]
description: Prepare the printer using slicer temperatures and native readiness status
gcode:
    _PRINT_INIT {rawparams}
    _HEAT_BED
    _HOME FORCE={params.FORCE_HOME|default(0)}
    _LEVEL FORCE={params.FORCE_LEVEL|default(0)}
    _MESH
    SMART_PARK
    _FINAL_HEAT
    ADAPTIVE_PURGE
    _PRINT_READY

[gcode_macro _PRINT_INIT]
# Per-print values, not editable machine settings.
variable_bed_temp: 0.0
variable_extruder_temp: 0.0
gcode:
    {% set bed = params.BED_TEMP|default(none)|float(none) %}
    {% set hotend = params.EXTRUDER_TEMP|default(none)|float(none) %}
    {% set cfg = printer.configfile.settings %}
    {% if cfg.extruder.control == 'watermark' %}
        {action_raise_error("Hotend PID tuning is missing. Run PID_CALIBRATE HEATER=extruder TARGET=<your printing temperature>, then SAVE_CONFIG before printing.")}
    {% endif %}
    {% for option in ['CHAMBER_TEMP', 'CHAMBER', 'COOL_DOWN', 'COOLDOWN_RATE'] %}
        {% if option in params and params[option]|float(none) != 0 %}
            {action_raise_error(option ~ " is not implemented in this current-hardware configuration")}
        {% endif %}
    {% endfor %}
    {% if bed is none or not cfg.heater_bed.min_temp <= bed <= cfg.heater_bed.max_temp %}
        {action_raise_error("BED_TEMP is required and must be within the bed temperature limits")}
    {% endif %}
    {% if hotend is none or not cfg.extruder.min_extrude_temp <= hotend <= cfg.extruder.max_temp %}
        {action_raise_error("EXTRUDER_TEMP is required and must be within the extrusion temperature limits")}
    {% endif %}
    {% if params.FORCE_HOME|default('0') not in ['0','1'] or params.FORCE_LEVEL|default('0') not in ['0','1'] %}
        {action_raise_error("FORCE_HOME and FORCE_LEVEL must be 0 or 1")}
    {% endif %}
    {% if printer.pause_resume.is_paused %}
        {action_raise_error("Resume or cancel the paused print before starting another")}
    {% endif %}
    _CHECK_EDDY
    _RESET_PAUSE_STATE
    _CLEAR_LAYER_PAUSES
    M400
    SET_GCODE_VARIABLE MACRO=_PRINT_INIT VARIABLE=bed_temp VALUE={bed}
    SET_GCODE_VARIABLE MACRO=_PRINT_INIT VARIABLE=extruder_temp VALUE={hotend}
    M107
    M220 S100
    M221 S100
    BED_MESH_CLEAR
    _PRINT_ORIGIN
    # Slicer object definitions are retained for meshing and purge placement.

[gcode_macro _PRINT_ORIGIN]
gcode:
    # Match G28's origin reset when homing is skipped, retaining SET_GCODE_OFFSET.
    # Read position after clearing the previous mesh, not before its transform changes.
    {% set pos = printer.gcode_move.position %}
    {% set origin = printer.gcode_move.homing_origin %}
    G92 X{pos.x - origin.x} Y{pos.y - origin.y} Z{pos.z - origin.z}

[gcode_macro _PRINT_READY]
gcode:
    _EXTRUSION_READY
    G90
    G92 E0

[gcode_macro _RESET_PRINT_STATE]
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_INIT VARIABLE=bed_temp VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PRINT_INIT VARIABLE=extruder_temp VALUE=0.0
