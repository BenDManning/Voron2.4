# Pause, resume, cancellation and pause-aware idle handling
# Layer-pause helpers adapted from Mainsail client.cfg, copyright 2022
# Alex Zellner, GPLv3.

[gcode_macro _PAUSE_STATE]
# Bookkeeping only; native pause_resume owns the paused flag and position.
variable_target: 0.0
variable_bed_target: 0.0
variable_restore_temperature: False
variable_retracted: 0.0
gcode:

[gcode_macro PAUSE]
rename_existing: _PAUSE_BASE
description: Capture print position, retract if hot and park if homed
gcode:
    {% if printer.pause_resume.is_paused %}
        {action_respond_info("Print already paused")}
    {% else %}
        _PAUSE_CAPTURE {rawparams}
        _PAUSE_RETRACT
        _PAUSE_PARK {rawparams}
    {% endif %}

[gcode_macro _PAUSE_CAPTURE]
gcode:
    {% set restore = params.RESTORE|default('1') %}
    {% if restore not in ['0','1'] %}
        {action_raise_error("RESTORE must be 0 or 1")}
    {% endif %}
    {% set pos = printer.gcode_move.position %}
    {% set act = printer.gcode_move.gcode_position %}
    {% set low = printer.toolhead.axis_minimum %}
    {% set high = printer.toolhead.axis_maximum %}
    {% for axis in ['X','Y'] %}
        {% if axis in params %}
            {% set value = params[axis]|float(none) %}
            {% set i = 0 if axis == 'X' else 1 %}
            {% if value is none or not low[i] <= value + pos[i] - act[i] <= high[i] %}
                {action_raise_error("Pause park coordinate is outside travel limits")}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% set z_min = params.Z_MIN|default(printer['gcode_macro _USER_VARIABLES'].pause_min_z)|float(none) %}
    {% if z_min is none or not 0 <= z_min <= high.z %}
        {action_raise_error("Invalid Z_MIN for pause parking")}
    {% endif %}
    _PAUSE_BASE
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=target VALUE={printer.extruder.target}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=bed_target VALUE={printer.heater_bed.target if restore == '1' else 0.0}
    {% set cfg = printer.configfile.settings.extruder %}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=restore_temperature VALUE={restore == '1' and cfg.min_extrude_temp <= printer.extruder.target <= cfg.max_temp}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=retracted VALUE=0.0

[gcode_macro _PAUSE_RETRACT]
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% if printer.extruder.can_extrude %}
        _RETRACT LENGTH={v.pause_retract} SPEED={v.pause_retract_speed}
        SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=retracted VALUE={v.pause_retract}
    {% endif %}

[gcode_macro _PAUSE_PARK]
gcode:
    {% if printer.toolhead.homed_axes == 'xyz' %}
        {% set v = printer['gcode_macro _USER_VARIABLES'] %}
        {% set pos = printer.gcode_move.position %}
        {% set act = printer.gcode_move.gcode_position %}
        {% set high = printer.toolhead.axis_maximum %}
        {% set x = high.x - v.pause_edge_margin if v.pause_x is none else v.pause_x %}
        {% set y = high.y - v.pause_edge_margin if v.pause_y is none else v.pause_y %}
        {% set speed = printer.configfile.settings.pause_resume.recover_velocity if v.pause_speed is none else v.pause_speed %}
        {% set z_min = params.Z_MIN|default(v.pause_min_z)|float + pos.z - act.z %}
        _PARK X={params.X|default(act.x + x - pos.x)|float} Y={params.Y|default(act.y + y - pos.y)|float} Z_MIN={[z_min,0]|max} LIFT={v.pause_lift} SPEED={speed} Z_SPEED={v.pause_z_speed}
    {% else %}
        {action_respond_info("Pause parking skipped: XYZ position is unknown")}
    {% endif %}

[gcode_macro RESUME]
rename_existing: _RESUME_BASE
description: Restore temperatures and return through native resume; refuse lost position
gcode:
    {% if printer.pause_resume.is_paused %}
        _RESUME_PREP {rawparams}
    {% else %}
        {action_respond_info("Print is not paused")}
    {% endif %}

[gcode_macro _RESUME_PREP]
gcode:
    {% set state = printer['gcode_macro _PAUSE_STATE'] %}
    {% set speed = params.VELOCITY|default(printer.configfile.settings.pause_resume.recover_velocity)|float(none) %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Position was lost during pause. Cancel the print; do not home over the part.")}
    {% endif %}
    {% if speed is none or not 0 < speed <= printer.toolhead.max_velocity %}
        {action_raise_error("Invalid resume VELOCITY")}
    {% endif %}
    {% if state.bed_target > 0 %}
        _WAIT_BED TARGET={state.bed_target}
    {% endif %}
    {% if state.restore_temperature %}
        _WAIT_NOZZLE TARGET={state.target}
    {% endif %}
    _RESUME_RETURN VELOCITY={speed}

[gcode_macro _RESUME_RETURN]
gcode:
    {% if not printer.pause_resume.is_paused or printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Resume interrupted or position lost; cancel rather than re-home")}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle is not ready for resume")}
    {% endif %}
    {% set state = printer['gcode_macro _PAUSE_STATE'] %}
    {% if state.retracted > 0 %}
        _EXTRUDE LENGTH={state.retracted} SPEED={printer['gcode_macro _USER_VARIABLES'].resume_speed}
    {% endif %}
    # Retire the retraction before the return move, so a retry cannot repeat it.
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=retracted VALUE=0.0
    _RESUME_BASE VELOCITY={params.VELOCITY|float}
    _RESET_PAUSE_STATE

[gcode_macro CANCEL_PRINT]
rename_existing: _CANCEL_PRINT_BASE
description: Stop the native job and heaters before optional finishing moves
gcode:
    TURN_OFF_HEATERS
    M107
    _CANCEL_PRINT_BASE
    _FINISH KIND=CANCEL

[gcode_macro _RESET_PAUSE_STATE]
gcode:
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=bed_target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=restore_temperature VALUE=False
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=retracted VALUE=0.0

[gcode_macro _CLEAR_LAYER_PAUSES]
gcode:
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

[gcode_macro _IDLE_TIMEOUT]
gcode:
    TURN_OFF_HEATERS
    {% if printer.pause_resume.is_paused %}
        {action_respond_info("Paused idle timeout: heaters off; motors remain enabled for resume.")}
    {% else %}
        M84
    {% endif %}

# Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0|1]] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
  {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0|1]] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE|int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: _SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  _SET_PRINT_STATS_INFO_BASE {rawparams}
  
