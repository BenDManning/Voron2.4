# Galileo2 manual filament handling and shared extrusion operations
# Heat to the material temperature first. LENGTH is mm; SPEED is mm/s.
# Defaults live in machine/variables.cfg. These commands do not move XYZ.

[gcode_macro LOAD_FILAMENT]
description: Load filament through a hot nozzle; optional LENGTH and SPEED
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set length = params.LENGTH|default(v.load_length)|float(none) %}
    {% set speed = params.SPEED|default(v.load_speed)|float(none) %}
    {% if length is none or speed is none %}
        {action_raise_error("LENGTH and SPEED must be numeric")}
    {% endif %}
    _MANUAL_FILAMENT DIRECTION=1 LENGTH={length} SPEED={speed}

[gcode_macro UNLOAD_FILAMENT]
description: Withdraw filament from a hot nozzle; optional LENGTH and SPEED
gcode:
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set length = params.LENGTH|default(v.unload_length)|float(none) %}
    {% set speed = params.SPEED|default(v.unload_speed)|float(none) %}
    {% if length is none or speed is none %}
        {action_raise_error("LENGTH and SPEED must be numeric")}
    {% endif %}
    _MANUAL_FILAMENT DIRECTION=-1 LENGTH={length} SPEED={speed}

[gcode_macro _MANUAL_FILAMENT]
gcode:
    {% set length = params.LENGTH|float(none) %}
    {% set speed = params.SPEED|float(none) %}
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% if params.DIRECTION|float(none) not in [-1,1] %}
        {action_raise_error("DIRECTION must be -1 or 1")}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Heat the nozzle to the material temperature before handling filament")}
    {% endif %}
    {% if length is none or not 0 < length <= printer.configfile.settings.extruder.max_extrude_only_distance %}
        {action_raise_error("LENGTH must be positive and within max_extrude_only_distance")}
    {% endif %}
    {% if speed is none or not 0 < speed <= v.manual_filament_max_speed %}
        {action_raise_error("SPEED exceeds the manual filament speed limit or is invalid")}
    {% endif %}
    _EXTRUDE LENGTH={length * params.DIRECTION|int} SPEED={speed}

[gcode_macro _EXTRUSION_READY]
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle is not ready for extrusion")}
    {% endif %}

[gcode_macro _EXTRUDE]
gcode:
    {% set length = params.LENGTH|float(none) %}
    {% set speed = params.SPEED|float(none) %}
    {% set cfg = printer.configfile.settings.extruder %}
    {% if length is none or not -cfg.max_extrude_only_distance <= length <= cfg.max_extrude_only_distance %}
        {action_raise_error("Extrusion length exceeds the configured limit or is invalid")}
    {% endif %}
    {% if speed is none or not 0 < speed <= cfg.max_extrude_only_velocity %}
        {action_raise_error("Extrusion speed exceeds the configured limit or is invalid")}
    {% endif %}
    {% if length != 0 %}
        _EXTRUSION_READY
        SAVE_GCODE_STATE NAME=FILAMENT_MOVE_state
        M83
        M220 S100
        M221 S100
        G1 E{length} F{speed * 60}
        RESTORE_GCODE_STATE NAME=FILAMENT_MOVE_state
    {% endif %}

[gcode_macro _RETRACT]
gcode:
    {% set length = params.LENGTH|float(none) %}
    {% if length is none or not 0 <= length <= printer.configfile.settings.extruder.max_extrude_only_distance %}
        {action_raise_error("Retraction length must be nonnegative and within the configured limit")}
    {% endif %}
    _EXTRUDE LENGTH=-{length} SPEED={params.SPEED}
