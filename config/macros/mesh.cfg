# Fresh native adaptive mesh using the installed Kalico Eddy probe

[gcode_macro _MESH]
gcode:
    {% set geometry = namespace(usable=True) %}
    {% for obj in printer.exclude_object.objects %}
        {% if obj.polygon is not defined or not obj.polygon or obj.polygon|length < 3 %}
            {% set geometry.usable = False %}
        {% endif %}
    {% endfor %}
    _MESH_PREP
    {% if geometry.usable %}
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% else %}
        {action_respond_info("Incomplete object polygons; using a full-bed mesh without discarding object definitions.")}
        BED_MESH_CALIBRATE ADAPTIVE=0
    {% endif %}
    _MESH_CHECK

[gcode_macro _MESH_PREP]
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' or not printer.quad_gantry_level.applied %}
        {action_raise_error("Home and level the gantry before meshing")}
    {% endif %}
    {% if not printer.exclude_object.objects %}
        {action_respond_info("No EXCLUDE_OBJECT definitions before PRINT_START; using the native full-bed mesh fallback.")}
    {% endif %}
    _CHECK_EDDY
    BED_MESH_CLEAR

[gcode_macro _MESH_CHECK]
gcode:
    {% if printer.bed_mesh.mesh_matrix|sum(start=[])|length == 0 %}
        {action_raise_error("Bed mesh did not produce a fresh mesh")}
    {% endif %}
