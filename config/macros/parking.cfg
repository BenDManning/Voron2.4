# Offset-aware, mesh-aware parking

[gcode_macro PARK]
description: Lift Z and park at the rear center without retracting
gcode:
    _PARK {rawparams}

[gcode_macro _PARK]
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Home all axes before PARK")}
    {% endif %}
    {% set v = printer['gcode_macro _USER_VARIABLES'] %}
    {% set low = printer.toolhead.axis_minimum %}
    {% set high = printer.toolhead.axis_maximum %}
    {% set pos = printer.gcode_move.position %}
    {% set act = printer.gcode_move.gcode_position %}
    {% set x = (low.x + high.x) / 2 if v.park_x is none else v.park_x|float %}
    {% set y = high.y - v.park_y_margin if v.park_y is none else v.park_y|float %}
    # Explicit X/Y use the caller's G-code coordinates, as Mainsail PAUSE does.
    {% if params.X is defined %}{% set x = params.X|float(none) %}
        {% if x is not none %}{% set x = x + pos.x - act.x %}{% endif %}
    {% endif %}
    {% if params.Y is defined %}{% set y = params.Y|float(none) %}
        {% if y is not none %}{% set y = y + pos.y - act.y %}{% endif %}
    {% endif %}
    {% set lift = params.LIFT|default(v.park_lift)|float(none) %}
    {% set minimum = params.Z_MIN|default(v.park_min_z)|float(none) %}
    {% set speed = params.SPEED|default(v.park_speed)|float(none) %}
    {% set z_speed = params.Z_SPEED|default(v.park_z_speed)|float(none) %}
    {% if x is none or y is none or not low.x <= x <= high.x or not low.y <= y <= high.y %}
        {action_raise_error("Park coordinates are outside the configured travel limits")}
    {% endif %}
    {% if lift is none or minimum is none or not 0 <= lift <= high.z - low.z or not 0 <= minimum <= high.z %}
        {action_raise_error("Invalid park clearance")}
    {% endif %}
    {% if speed is none or z_speed is none or not math.isfinite(speed) or not math.isfinite(z_speed) or speed <= 0 or z_speed <= 0 %}
        {action_raise_error("Parking speeds must be positive finite values")}
    {% endif %}
    {% set surface = namespace(high=0.0) %}
    {% for row in printer.bed_mesh.mesh_matrix %}
        {% for value in row %}{% set surface.high = [surface.high, value]|max %}{% endfor %}
    {% endfor %}
    {% set z = [pos.z, [[pos.z + lift, minimum]|max, high.z - surface.high - v.park_ceiling_margin]|min]|max %}
    SAVE_GCODE_STATE NAME=PARK_state
    G90
    M220 S100
    G0 Z{act.z + z - pos.z} F{[z_speed, printer.configfile.settings.printer.max_z_velocity]|min * 60}
    {% if params.MOVE_XY|default(1)|int and z - pos.z >= v.park_min_xy_clearance %}
        G0 X{act.x + x - pos.x} Y{act.y + y - pos.y} F{[speed, printer.toolhead.max_velocity]|min * 60}
    {% elif params.MOVE_XY|default(1)|int %}
        {action_respond_info("PARK: insufficient Z clearance; XY parking skipped")}
    {% endif %}
    RESTORE_GCODE_STATE NAME=PARK_state
