# Bed heating, nozzle standby and shared temperature waits

[gcode_macro _HEAT_BED]
gcode:
    {% set state = printer['gcode_macro _PRINT_INIT'] %}
    {% set standby = printer['gcode_macro _USER_VARIABLES'].standby_temp|float(none) %}
    {% set cfg = printer.configfile.settings.extruder %}
    {% if standby is none or not cfg.min_temp <= standby <= cfg.max_temp %}
        {action_raise_error("standby_temp must be within the hotend temperature limits")}
    {% endif %}
    M140 S{state.bed_temp}
    M104 S{[standby, state.extruder_temp]|min}
    _WAIT_BED TARGET={state.bed_temp}

[gcode_macro _WAIT_BED]
gcode:
    M190 S{params.TARGET|float}

[gcode_macro _FINAL_HEAT]
gcode:
    _WAIT_NOZZLE TARGET={printer['gcode_macro _PRINT_INIT'].extruder_temp}

[gcode_macro _WAIT_NOZZLE]
gcode:
    {% set target = params.TARGET|float(none) %}
    {% set cfg = printer.configfile.settings.extruder %}
    {% if target is none or not cfg.min_extrude_temp <= target <= cfg.max_temp %}
        {action_raise_error("Nozzle target must be within the extrusion temperature limits")}
    {% endif %}
    M109 S{target}
    _EXTRUSION_READY
