# Shared macro settings - distances in mm, speeds in mm/s, temperatures in C
# None selects the hardware-derived position described beside the setting.

[gcode_macro _USER_VARIABLES]
# Heating
variable_standby_temp: 150

# Rear-center parking
variable_park_x: None                  # Midpoint of the configured X travel
variable_park_y: None                  # Y maximum minus park_y_margin
variable_park_y_margin: 10
variable_park_lift: 10
variable_park_min_z: 10
variable_park_ceiling_margin: 1
variable_park_min_xy_clearance: 2
variable_park_speed: 100
variable_park_z_speed: 10

# Pause and resume
variable_pause_x: None                 # X maximum minus pause_edge_margin
variable_pause_y: None                 # Y maximum minus pause_edge_margin
variable_pause_edge_margin: 5
variable_pause_lift: 2
variable_pause_min_z: 0                # Minimum G-code Z for PAUSE
variable_pause_z_speed: 15
variable_pause_speed: None             # Native pause_resume recover_velocity
variable_pause_retract: 1
variable_pause_retract_speed: 35
variable_resume_speed: 35

# End and cancel retraction
variable_end_retract: 2
variable_end_retract_speed: 25
variable_cancel_retract: 5
variable_cancel_retract_speed: 35

# Galileo2 manual filament handling
variable_load_length: 30
variable_load_speed: 3
variable_unload_length: 40
variable_unload_speed: 5
variable_manual_filament_max_speed: 10

gcode:
