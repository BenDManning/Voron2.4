# Object-aware parking and line purge. Distances in mm; flow in mm^3/s; speeds in mm/s.
# With no object definitions, use the front-left edge. Known objects need room
# for the line in front or to their left. Settings are local to this addon.
# When disabled, SMART_PARK uses the ordinary rear-center _PARK workflow.

[gcode_macro SMART_PARK]
description: Lift and park at the adaptive purge start without heating or extrusion
gcode:
    ADAPTIVE_PURGE PARK_ONLY=1

[gcode_macro ADAPTIVE_PURGE]
description: Prime beside the print, then wipe and lift
variable_enabled: True
variable_park_height: 10.0             # Minimum G-code Z for SMART_PARK
variable_height: 0.8
variable_filament: 30.0
variable_line_length: 30.0
variable_tip_distance: 1.5
variable_flow: 12.0
variable_object_margin: 10.0
variable_edge_margin: 5.0
variable_wipe: 10.0
variable_clearance: 5.0
variable_travel_speed: 100.0
variable_z_speed: 10.0
gcode:
    {% set v = printer['gcode_macro ADAPTIVE_PURGE'] %}
    {% if params.PARK_ONLY|default('0') not in ['0', '1'] %}
        {action_raise_error('PARK_ONLY must be 0 or 1')}
    {% endif %}
    {% set park_only = params.PARK_ONLY|default('0') == '1' %}
    {% if park_only and not v.enabled %}
        _PARK
    {% elif v.enabled %}
        {% if printer.toolhead.homed_axes != 'xyz' %}
            {action_raise_error('Home XYZ before adaptive parking or purging')}
        {% endif %}
        {% if not park_only and not printer.extruder.can_extrude %}
            {action_raise_error('ADAPTIVE_PURGE requires homed XYZ and a hot nozzle')}
        {% endif %}
        {% for value in [v.park_height, v.height, v.filament, v.line_length, v.flow, v.object_margin, v.edge_margin, v.wipe, v.clearance, v.travel_speed, v.z_speed] %}
            {% if not (value is number and math.isfinite(value) and value > 0) %}
                {action_raise_error('ADAPTIVE_PURGE settings must be positive finite numbers')}
            {% endif %}
        {% endfor %}
        {% set cfg = printer.configfile.settings.extruder %}
        {% if not (v.tip_distance is number and math.isfinite(v.tip_distance) and 0 <= v.tip_distance <= cfg.max_extrude_only_distance) %}
            {action_raise_error('ADAPTIVE_PURGE tip_distance exceeds the extrusion limit')}
        {% endif %}
        {% set area = math.pi * (cfg.filament_diameter / 2) ** 2 %}
        {% set cross = area * v.filament / v.line_length %}
        {% if cross > cfg.max_extrude_cross_section %}
            {action_raise_error('ADAPTIVE_PURGE line exceeds max_extrude_cross_section; reduce filament or increase line_length')}
        {% endif %}

        # Object coordinates are G-code coordinates; travel limits are not.
        {% set pos = printer.gcode_move.position %}
        {% set act = printer.gcode_move.gcode_position %}
        {% set low = printer.toolhead.axis_minimum %}
        {% set high = printer.toolhead.axis_maximum %}
        {% set xmin = low.x + v.edge_margin - pos.x + act.x %}
        {% set xmax = high.x - v.edge_margin - pos.x + act.x %}
        {% set ymin = low.y + v.edge_margin - pos.y + act.y %}
        {% set ymax = high.y - v.edge_margin - pos.y + act.y %}
        {% set span = v.line_length + v.wipe %}
        {% set bounds = namespace(xmin=xmax, xmax=xmin, ymin=ymax, ymax=ymin, known=False) %}
        {% for obj in printer.exclude_object.objects %}
            {% if obj.polygon is not defined or obj.polygon|length < 3 %}
                {action_raise_error('ADAPTIVE_PURGE needs complete object polygons; use slicer priming if unavailable')}
            {% endif %}
            {% for point in obj.polygon %}
                {% if point|length != 2 or not (point[0] is number and point[1] is number and math.isfinite(point[0]) and math.isfinite(point[1])) %}
                    {action_raise_error('ADAPTIVE_PURGE found invalid object coordinates')}
                {% endif %}
                {% set bounds.xmin = [bounds.xmin, point[0]]|min %}
                {% set bounds.xmax = [bounds.xmax, point[0]]|max %}
                {% set bounds.ymin = [bounds.ymin, point[1]]|min %}
                {% set bounds.ymax = [bounds.ymax, point[1]]|max %}
                {% set bounds.known = True %}
            {% endfor %}
        {% endfor %}
        {% set along_x = xmax - xmin >= span and (not bounds.known or bounds.ymin - v.object_margin >= ymin) %}
        {% set along_y = ymax - ymin >= span and (not bounds.known or bounds.xmin - v.object_margin >= xmin) %}
        {% if along_x %}
            {% set x = [[(bounds.xmin + bounds.xmax - v.line_length)/2, xmin]|max, xmax-span]|min if bounds.known else xmin %}
            {% set y = [bounds.ymin - v.object_margin, ymax]|min if bounds.known else ymin %}
            {% set dx = v.line_length %}{% set dy = 0 %}
            {% set wx = v.wipe %}{% set wy = 0 %}
        {% elif along_y %}
            {% set x = [bounds.xmin - v.object_margin, xmax]|min if bounds.known else xmin %}
            {% set y = [[(bounds.ymin + bounds.ymax - v.line_length)/2, ymin]|max, ymax-span]|min if bounds.known else ymin %}
            {% set dx = 0 %}{% set dy = v.line_length %}
            {% set wx = 0 %}{% set wy = v.wipe %}
        {% else %}
            {action_raise_error('No room for ADAPTIVE_PURGE in front of or left of the objects; reposition the print or use slicer priming')}
        {% endif %}

        # Reserve mesh correction at both Z limits and lift before XY travel.
        {% set surface = namespace(low=0.0, high=0.0) %}
        {% for row in printer.bed_mesh.mesh_matrix %}
            {% for value in row %}
                {% set surface.low = [surface.low, value]|min %}
                {% set surface.high = [surface.high, value]|max %}
            {% endfor %}
        {% endfor %}
        {% set purge_z = v.height + pos.z - act.z %}
        {% set lift_z = [pos.z + v.clearance + surface.high - surface.low, purge_z + v.clearance]|max %}
        {% if park_only %}
            {% set lift_z = [lift_z, v.park_height + pos.z - act.z]|max %}
        {% endif %}
        {% if purge_z + surface.low < [low.z, 0]|max or lift_z + surface.high > high.z - 1 %}
            {action_raise_error('ADAPTIVE_PURGE has insufficient Z clearance with the current offsets/mesh')}
        {% endif %}
        {% set travel = [v.travel_speed, printer.toolhead.max_velocity]|min * 60 %}
        {% set zspeed = [v.z_speed, printer.configfile.settings.printer.max_z_velocity]|min * 60 %}
        {% set line_speed = [v.flow / cross, v.travel_speed, printer.toolhead.max_velocity]|min * 60 %}
        {% set tip_speed = [v.flow / area, cfg.max_extrude_only_velocity]|min * 60 %}
        SAVE_GCODE_STATE NAME=adaptive_purge_state
        G90
        M83
        M220 S100
        M221 S100
        G0 Z{act.z + lift_z - pos.z} F{zspeed}
        G0 X{x} Y{y} F{travel}
        {% if not park_only %}
            G0 Z{v.height} F{zspeed}
            {% if v.tip_distance > 0 %}G1 E{v.tip_distance} F{tip_speed}{% endif %}
            G1 X{x + dx} Y{y + dy} E{v.filament} F{line_speed}
            G0 X{x + dx + wx} Y{y + dy + wy} F{travel}
            G0 Z{v.height + v.clearance} F{zspeed}
        {% endif %}
        RESTORE_GCODE_STATE NAME=adaptive_purge_state
    {% endif %}
