# TMC autotune - Galileo2 LDO 36 mm motor with 9-tooth pinion

[autotune_tmc extruder]
# Motor model and supply
motor: ldo-36sth20-1004ahg-9T
voltage: 24                           # V

# Chopper tuning
tuning_goal: performance              # SpreadCycle for the small G2 motor
extra_hysteresis: 0                   # Additional hysteresis, 0-8
tbl: 2                                # Comparator blank time, 0-3
toff: 0                               # 0 = automatic


